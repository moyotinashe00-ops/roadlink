name: roadlink_reporter
description: "RoadLink Reporter — citizen accident reporting app for RoadLink ZW."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  geolocator: ^11.0.0
  image_picker: ^1.1.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.5
  # Required by the FlutterFire-generated lib/firebase_options.dart. Push notifications are not wired in yet
  # (no Firebase.initializeApp call), so this only makes that file compile.
  firebase_core: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
