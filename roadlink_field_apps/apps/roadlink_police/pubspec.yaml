name: roadlink_police
description: "RoadLink Police — traffic police unit app for RoadLink ZW."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  roadlink_shared:
    path: ../../packages/roadlink_shared
  # Required by the FlutterFire-generated lib/firebase_options.dart. Push notifications are not wired in yet
  # (no Firebase.initializeApp call), so this only makes that file compile.
  firebase_core: ^5.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
