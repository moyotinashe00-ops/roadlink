# Local development stack: PostGIS database + the API.
#   docker compose up --build
#   docker compose exec api node db/migrate.js --seed      # demo data
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadlink
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/roadlink
      JWT_SECRET: dev-only-change-me
      USSD_SECRET: dev-ussd-secret
      SEED_PASSWORD: ChangeMe123!
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177"
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]

volumes:
  pgdata:
  uploads: